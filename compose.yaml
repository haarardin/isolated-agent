# The agent only joins the internal network. Filtered egress uses compose.web.yaml.
services:
  agent:
    image: ${PROJECT_IMAGE:-localhost/isolated-agent-project:dev}
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    command: ["sleep", "infinity"]
    environment:
      HOME: /root
      CODEX_HOME: /root/.codex
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /root/.cache/go-mod
      GOPATH: /root/.cache/go
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,::1,postgres,redis
      no_proxy: localhost,127.0.0.1,::1,postgres,redis
    volumes:
      - ${PROJECT_DIR:-./workspace}:/workspace:rw
      - codex-state:/root/.codex
      - agent-cache:/root/.cache
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated-dev
volumes:
  codex-state:
  agent-cache:
networks:
  isolated-dev:
    internal: true
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${AGENT_SUBNET:-10.89.71.0/24}
x-podman:
  in_pod: false
