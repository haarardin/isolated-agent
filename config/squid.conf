# Template: a validated AGENT_SUBNET is substituted at startup.
http_port 3128
visible_hostname isolated-agent-egress
acl sandbox_clients src @AGENT_SUBNET@
acl blocked_dst dst "/etc/squid/blocked-cidrs.txt"
http_access deny manager
http_access deny !sandbox_clients
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked_dst
http_access allow sandbox_clients
http_access deny all
cache deny all
cache_mem 0 MB
forwarded_for delete
access_log stdio:/var/log/squid/access.log
