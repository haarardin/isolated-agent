# Example only: sidecar + external MCP servers.
# The coding runtime is installed ONLY when enabled in [[agents]].
[[agents]]
id = "codex"
enabled = true

[[agents.install]]
type = "script"
file = "install-codex.sh"
verify = ["codex --version"]

[agents.state]
base = "./volumes/codex"
target = "/root/.codex"

[base]
image = "debian:13-slim"
[apt]
packages = []

[[agent_tools]]
id = "indexer"
kind = "mcp"
placement = "sidecar"
enabled = false

[[agent_tools.install]]
type = "apt"
packages = ["python3"]
# Replace installer and command with a real MCP HTTP server before enabling.

[agent_tools.runtime]
command = ["/opt/indexer/server", "--port=8787"]
port = 8787

[agent_tools.integration]
transport = "http"
path = "/mcp"

[[agent_tools]]
id = "remote"
kind = "mcp"
placement = "external"
enabled = false

[agent_tools.integration]
transport = "http"
url = "https://mcp.example.org/mcp"
