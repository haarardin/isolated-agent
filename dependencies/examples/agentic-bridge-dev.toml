# Opt-in Bridge profile. Copy this file to dependencies/dependencies.toml.
[base]
image = "debian:13-slim"

[apt]
packages = ["python3", "python3-venv", "python3-pip", "libpq-dev", "postgresql-client", "tmux"]

[[install]]
id = "go-sdk"
type = "script"
file = "install-go.sh"
args = ["1.27.3"]
verify = ["go version"]

[[install]]
id = "node-sdk"
type = "script"
file = "install-node.sh"
args = ["24.11.1"]
verify = ["node --version", "npm --version"]

[[install]]
id = "language-servers"
type = "command"
run = "GOBIN=/usr/local/bin go install golang.org/x/tools/gopls@v0.24.0 && npm install -g --no-audit --no-fund typescript@5.9.3 typescript-language-server@5.1.3"
verify = ["gopls version", "typescript-language-server --version"]

[[agent_tools]]
id = "serena-cli"
kind = "mcp"
placement = "embedded"
enabled = true
[[agent_tools.install]]
type = "command"
run = "python3 -m venv /opt/agent-tools/serena && /opt/agent-tools/serena/bin/pip install --no-cache-dir 'serena-agent==1.7.0'"
verify = ["/opt/agent-tools/serena/bin/serena --help >/dev/null"]
[agent_tools.state]
base = "./volumes/serena"
target = "/root/.serena"
[agent_tools.integration]
transport = "stdio"
command = "/opt/agent-tools/serena/bin/serena"
args = ["start-mcp-server", "--project=/workspace/agentic-bridge-cli", "--context=codex", "--transport=stdio", "--enable-web-dashboard=false", "--open-web-dashboard=false", "--enable-gui-log-window=false"]

[[agent_tools]]
id = "serena-architecture"
kind = "mcp"
placement = "embedded"
enabled = true
[agent_tools.integration]
transport = "stdio"
command = "/opt/agent-tools/serena/bin/serena"
args = ["start-mcp-server", "--project=/workspace/agentic-bridge-architecture", "--context=codex", "--transport=stdio", "--enable-web-dashboard=false", "--open-web-dashboard=false", "--enable-gui-log-window=false"]

[[agent_tools]]
id = "serena-server"
kind = "mcp"
placement = "embedded"
enabled = true
[agent_tools.integration]
transport = "stdio"
command = "/opt/agent-tools/serena/bin/serena"
args = ["start-mcp-server", "--project=/workspace/agentic-bridge-server", "--context=codex", "--transport=stdio", "--enable-web-dashboard=false", "--open-web-dashboard=false", "--enable-gui-log-window=false"]

[[agent_tools]]
id = "serena-ui"
kind = "mcp"
placement = "embedded"
enabled = true
[agent_tools.integration]
transport = "stdio"
command = "/opt/agent-tools/serena/bin/serena"
args = ["start-mcp-server", "--project=/workspace/agentic-bridge-ui", "--context=codex", "--transport=stdio", "--enable-web-dashboard=false", "--open-web-dashboard=false", "--enable-gui-log-window=false"]

[[agent_tools]]
id = "playwright"
kind = "mcp"
placement = "embedded"
enabled = true
[[agent_tools.install]]
type = "script"
file = "install-playwright-mcp.sh"
verify = ["isolated-agent-playwright-mcp --help >/dev/null"]
[agent_tools.integration]
transport = "stdio"
command = "/usr/local/bin/isolated-agent-playwright-mcp"
args = ["--browser=chromium", "--headless", "--no-sandbox", "--isolated", "--ignore-roots"]

[project]
# Multiple independent modules: cd into each project before running checks.
