# Optional example: Go SDK + OpenCode V2 + Serena MCP in one agent image.
# This is a REFERENCE, not a drop-in replacement for your existing customized
# dependencies/dependencies.toml. Merge entries deliberately and rebuild.
# The coding runtime is installed ONLY when enabled in [[agents]].
[[agents]]
id = "codex"
enabled = false

[[agents.install]]
type = "script"
file = "install-codex.sh"
verify = ["codex --version"]

[agents.state]
base = "./volumes/codex"
target = "/root/.codex"

[base]
image = "debian:13-slim"

[apt]
packages = ["python3", "python3-venv", "python3-pip", "pkg-config", "clangd"]

[[install]]
id = "go-sdk"
type = "script"
file = "install-go.sh"
args = ["1.27.0"]
verify = ["go version"]

[[agents]]
id = "opencode"
enabled = true

[[agents.install]]
type = "script"
file = "install-opencode.sh"
verify = ["opencode --version"]

[agents.state]
base = "./volumes/opencode"
target = "/root/.isolated-opencode"

[[agent_tools]]
id = "serena"
kind = "mcp"
placement = "embedded"
enabled = true

[[agent_tools.install]]
type = "command"
run = "python3 -m venv /opt/agent-tools/serena && /opt/agent-tools/serena/bin/pip install --no-cache-dir 'serena-agent==1.7.0'"
verify = ["/opt/agent-tools/serena/bin/serena --help >/dev/null"]

[[agent_tools.install]]
type = "command"
run = "GOBIN=/usr/local/bin go install golang.org/x/tools/gopls@v0.20.0"
verify = ["gopls version"]

[agent_tools.state]
base = "./volumes/serena"
target = "/root/.serena"

# Serena's user-owned global config can bind cpp to /usr/bin/clangd.
[agent_tools.lsp]
adapter = "serena"
servers = { cpp = "/usr/bin/clangd" }

[agent_tools.integration]
transport = "stdio"
command = "/opt/agent-tools/serena/bin/serena"
# Reuses the existing Serena context from Codex; integration with OpenCode
# must be checked in a live rootless Podman test before considering it ready.
args = ["start-mcp-server", "--project=/workspace", "--context=codex", "--transport=stdio", "--enable-web-dashboard=false", "--open-web-dashboard=false", "--enable-gui-log-window=false"]

[project]
test = "go test ./..."
race = "go test -race ./..."
lint = "go vet ./..."
integration = "go test -tags=integration ./..."
