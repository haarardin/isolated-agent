# Universal dependencies for Debian 13 + Codex; no default language SDK.
[base]
image = "debian:13-slim"

[apt]
packages = []

# Examples of install steps (uncomment to use).
# [[install]]
# id = "python"
# type = "apt"
# packages = ["python3", "python3-venv", "python3-pip"]
# verify = ["python3 --version"]

# [[install]]
# id = "go"
# type = "script"
# file = "install-go.sh"
# args = ["1.27.0"]
# verify = ["go version"]

# [[install]]
# type = "deb"
# file = "some-package_1.0_amd64.deb"

# [[install]]
# type = "archive"
# file = "sdk.tar.gz"
# destination = "/opt/sdk"

# [[install]]
# type = "command"
# run = "echo 'custom trusted command'"

# AI coding runtimes are first-class, independently enabled agents.
# AGENT_RUNTIME in .env only selects which ALREADY ENABLED agent runs.
# Disabling Codex prevents its download/install; disabling OpenCode prevents npm.
[[agents]]
id = "codex"
enabled = true

[[agents.install]]
type = "script"
file = "install-codex.sh"
verify = ["codex --version"]

# The host's CODEX_STATE_VOLUME and legacy named-volume options remain
# authoritative for this target to preserve existing Codex sessions.
[agents.state]
base = "./volumes/codex"
target = "/root/.codex"

[[agents]]
id = "opencode"
enabled = false

[[agents.install]]
type = "apt"
packages = ["nodejs", "npm"]

[[agents.install]]
type = "command"
run = "npm install --global --no-audit --no-fund @opencode/cli@2.0.0"
verify = ["opencode --version"]

[agents.state]
base = "./volumes/opencode"
target = "/root/.isolated-opencode"

# Optional MCP / supporting tools are configured separately as [[agent_tools]].
# See dependencies/examples/go-opencode-serena.toml for Serena + Go.

[project]
