name: Remote Control and egress security
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/remote-control-network-isolation]
  workflow_dispatch:
jobs:
  config-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Static regression tests and subnet collisions
        run: |
          bash scripts/test-security-static.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          make test-image-reuse-static
          make test-project-context-static
          make test-serena-static
      - name: Verify Compose web, offline, Serena and optional services
        run: |
          mkdir -p .state
          # Docker Compose derives its default project name from the checkout
          # directory. Override that to match the explicit test fixture.
          export COMPOSE_PROJECT_NAME=isolated-agent-demo
          # Standalone CI has no rootless Podman network. Seed a validated
          # fixture for the Squid config renderer, without creating a network.
          printf '%s\n' '{"project":"isolated-agent-demo","name":"isolated-agent-demo_isolated-dev","subnet":"10.89.71.0/24"}' > .state/network.json
          COMPOSE_PROJECT_NAME=isolated-agent-demo bash scripts/prepare-web.sh
          for profile in base web example serena; do
            case "$profile" in
              base) files="-f compose.yaml";;
              web) files="-f compose.yaml -f compose.web.yaml";;
              example) files="-f compose.yaml -f compose.web.yaml -f compose.example-services.yaml";;
              serena) files="-f compose.yaml -f compose.web.yaml -f compose.serena.yaml";;
            esac
            docker compose $files config --format json > "/tmp/$profile.json"
          done
          python3 - <<'PY'
          import json
          def load(name):
              with open('/tmp/'+name+'.json') as f:
                  return json.load(f)
          offline=load('base')
          web=load('web')
          example=load('example')
          serena=load('serena')
          for name,conf in [('offline',offline),('web',web),('example',example),('serena',serena)]:
              sv=conf['services']['agent']
              assert set(sv['networks'])=={'isolated-dev'},(name,sv['networks'])
              internal_net=conf['networks']['isolated-dev']
              assert internal_net['external'] is True,internal_net
              assert internal_net['name']=='isolated-agent-demo_isolated-dev',internal_net
              assert sv['read_only'] is True
              assert sv['cap_drop']==['ALL']
              assert not sv.get('ports')
              assert not sv.get('privileged',False)
              assert not sv.get('network_mode')
              assert any(v['target']=='/root/.codex' for v in sv['volumes'])
              # The image contains /root/Documents -> /workspace; ensure
              # no second host mount sneaks into any Compose profile.
              mounts={v['target']:v for v in sv['volumes']}
              workspace=mounts['/workspace']
              assert workspace['type']=='bind',workspace
              assert not workspace.get('read_only',False),name
              assert '/root/Documents' not in mounts,name
          assert set(offline['services'])=={'agent'}
          for conf in (web,example,serena):
              assert 'squid' in conf['services']
              assert set(conf['services']['squid']['networks'])=={'isolated-dev','outbound'}
              assert not conf['services']['squid'].get('ports')
          assert set(example['services'])=={'agent','postgres','redis','squid'}
          for s in ('postgres','redis'):
              assert set(example['services'][s]['networks'])=={'isolated-dev'}
              assert not example['services'][s].get('ports')
          assert serena['services']['agent']['image'].endswith('isolated-agent-serena:dev')
          print('All Compose security profiles validated')
          PY
      - name: Squid ACL syntax check with generated CIDRs
        run: |
          docker run --rm --network none --entrypoint /usr/sbin/squid \
            -v "$PWD/.state/squid.conf:/etc/squid/squid.conf:ro" \
            -v "$PWD/.state/blocked-cidrs.txt:/etc/squid/blocked-cidrs.txt:ro" \
            ubuntu/squid:6.6-24.04_edge -k parse -f /etc/squid/squid.conf
  codex-cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build official Codex CLI installation layers
        run: |
          docker build -f images/base/Containerfile -t localhost/isolated-agent-base:dev .
          docker build -f images/codex/Containerfile -t localhost/isolated-agent-codex:dev .
      - name: Build project agent image with persistent Documents alias
        run: |
          docker build -f images/project/Containerfile \
            --build-arg CODEX_IMAGE=localhost/isolated-agent-codex:dev \
            -t localhost/isolated-agent-project:ci .
      - name: Verify projectless Remote workspace on read-only root
        run: |
          scratch="$(mktemp -d)"
          cleanup() {
            # Container root can create root-owned files inside the test bind.
            # Clean them with the same image, then remove the host directory.
            docker run --rm --network none \
              -v "$scratch:/workspace:rw" \
              --entrypoint /bin/bash localhost/isolated-agent-project:ci \
              -ec 'rm -rf /workspace/Codex' >/dev/null 2>&1 || true
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          docker run --rm --read-only --network none \
            -v "$scratch:/workspace:rw" \
            --entrypoint /bin/bash localhost/isolated-agent-project:ci -ec '
              test -L /root/Documents
              test "$(readlink /root/Documents)" = /workspace
              mkdir -p /root/Documents/Codex/remote-test
              printf "remote-ok\n" > /root/Documents/Codex/remote-test/result.txt
              test "$(cat /workspace/Codex/remote-test/result.txt)" = remote-ok
              if touch /root/forbidden-write 2>/dev/null; then
                echo "Root filesystem unexpectedly writable" >&2
                exit 1
              fi
              # Scratch bind files were created as root inside Docker.
              # Return them to the host runner UID for trap cleanup.
              chown -R "$(stat -c '%u:%g' /workspace)" /workspace/Codex
            '
          test "$(cat "$scratch/Codex/remote-test/result.txt")" = remote-ok
      - name: Check experimental CLI subcommands (without login)
        run: |
          docker run --rm --entrypoint /bin/bash --network none \
            localhost/isolated-agent-codex:dev -ec '
              codex --version
              codex remote-control --help >/dev/null
              codex remote-control start --help >/dev/null
              codex remote-control pair --help >/dev/null
              codex remote-control stop --help >/dev/null
              codex app-server daemon --help >/dev/null
              test -x /root/.codex/packages/standalone/current/codex
            '
