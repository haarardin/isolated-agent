# Only Squid connects to an outbound network; never attach agent there.
services:
  squid:
    image: ${SQUID_IMAGE:-docker.io/ubuntu/squid:6.6-24.04_edge}
    entrypoint: ["/usr/sbin/squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.state/squid.conf:/etc/squid/squid.conf:ro
      - ./.state/blocked-cidrs.txt:/etc/squid/blocked-cidrs.txt:ro
    networks:
      isolated-dev:
        # Avoid ambiguous "squid" DNS across Compose projects on a shared network.
        aliases:
          - ${COMPOSE_PROJECT_NAME:-isolated-agent-demo}-egress
      outbound: {}
networks:
  outbound:
    internal: false
x-podman:
  in_pod: false
