<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Local ATS fixture</title></head>
<body>
  <h1>Offline application form test</h1>
  <form onsubmit="event.preventDefault(); document.getElementById('result').textContent='Local only';">
    <label>Full name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Resume <input type="file" name="resume" accept=".pdf,.docx" required></label>
    <button type="submit">Submit (local only)</button>
  </form>
  <p id="result"></p>
</body></html>
