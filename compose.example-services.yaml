services:
  agent:
    environment:
      TEST_POSTGRES_DSN: postgres://agent:agent@postgres:5432/app?sslmode=disable
      TEST_REDIS_ADDR: redis:6379

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - isolated-dev

  redis:
    image: docker.io/library/redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - isolated-dev

volumes:
  postgres-data:
